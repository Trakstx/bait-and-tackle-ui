name: Bug report
description: What happened, what did you expect, and how can we reproduce it?
title: "[bug] "
body:
  - type: markdown
    attributes:
      value: "This is public. Do not include passwords, dashboard URLs, full logs, or private information. No email address is needed."
  - type: input
    id: version
    attributes:
      label: Bait & Tackle version
      placeholder: 0.7.0
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Bug report details
      description: What happened, what did you expect, and how can we reproduce it?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context and examples
      description: Windows version, resolution, affected feature, and optional sanitized screenshots or short excerpts.
